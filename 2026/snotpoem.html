<p>1/28/26</p>
<p>
I could use the<br>
littlest piece of tissue<br>
to clean up the littelest bit of<br>
snot in my left nostril<br>
but my big hands<br>
grabs the biggest sheet<br>
and clean up only mostly air<br>
<br>
that little snot<br>
overcomes itself<br>
in the trash can<br><br>
(my meek hands dwindle in comparison)
</p>
